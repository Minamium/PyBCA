<div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap; margin-bottom:0.75rem;">
  <a class="btn" href="{{ '/' | relative_url }}">Home</a>
  <a class="btn" href="{{ '/ja/' | relative_url }}">JA</a>
  <a class="btn" href="{{ '/en/' | relative_url }}">EN</a>
  <button id="theme-toggle" class="btn" type="button">Dark</button>
</div>
<script>
(function () {
  const KEY = 'jtd-theme';
  const btn = document.getElementById('theme-toggle');
  const api = window.jtd;

  function setTheme(t) {
    api.setTheme(t);
    localStorage.setItem(KEY, t);
    btn.textContent = (t === 'dark') ? 'Light' : 'Dark';
  }

  if (!btn || !api || typeof api.setTheme !== 'function') {
    return;
  }

  const saved = localStorage.getItem(KEY);
  if (saved) setTheme(saved);

  btn.addEventListener('click', () => {
    const cur = localStorage.getItem(KEY) || 'light';
    setTheme(cur === 'dark' ? 'light' : 'dark');
  });
})();
</script>
