<div id="bca-cell-review">
  <h3>BCA-IP セル空間</h3>
  <div class="viz-controls">
    <label class="form-label">保存データ
      <select class="form-select" data-field="source">
        <option value="p1">旧 p=1.0・停止時点（512試行）</option>
        <option value="p05">p=0.5・10万更新の診断（2試行）</option>
        <option value="initial">初期状態</option>
        <option value="replay1">旧 p=1.0・trial 1の短時間再生</option>
        <option value="replay05">診断 p=0.5・trial 1の短時間再生</option>
      </select>
    </label>
    <label class="form-label">試行ID
      <input class="form-control" data-field="trial" type="number" min="0" max="511" value="1" step="1">
    </label>
    <label class="form-label">表示範囲
      <select class="form-select" data-field="region">
        <option value="all">回路全体</option>
        <option value="A">Unit A</option>
        <option value="B">Unit B</option>
        <option value="A4" selected>A4：TD入力・FSM-core・出力</option>
        <option value="B3">B3：TD入力・FSM-core・出力</option>
        <option value="A4_input">A4：TD→FSM観測部</option>
        <option value="A4_core">A4：FSM-core</option>
        <option value="A4_output">A4：FSM→Amp観測部</option>
        <option value="A4_amp">A4：Amp</option>
        <option value="comparator_rsm">Comparator・RSM</option>
      </select>
    </label>
  </div>
  <div class="viz-row">
    <button class="btn" type="button" data-action="out" aria-label="回路を縮小">−</button>
    <button class="btn" type="button" data-action="in" aria-label="回路を拡大">＋</button>
    <span class="text-small">ドラッグで移動・セルに触れて座標を表示</span>
  </div>
  <div class="text-small tabular-nums" data-status aria-live="polite"></div>
  <div data-replay hidden>
    <label class="form-label">保存状態からの追加更新：<span data-frame-label class="tabular-nums">0</span>
      <input class="form-range" data-field="frame" type="range" min="0" max="24" value="0" step="1">
    </label>
    <button class="btn" data-action="play" type="button">再生</button>
  </div>
  <canvas class="cursor-interaction" role="img" aria-label="保存されたセル空間。回路は灰色、トークンは丸、Token binは四角、イベント観測点は輪で表示。"></canvas>
  <div class="viz-row text-small">
    <span><span data-legend="wire">━</span> 回路</span>
    <span><span data-legend="token">●</span> 状態2・トークン</span>
    <span><span data-legend="bin">■</span> Token bin</span>
    <span><span data-legend="event">○</span> イベント観測点</span>
  </div>
  <div class="text-small tabular-nums" data-coordinate>座標は元のセル空間の (x, y)</div>
  <div class="text-small tabular-nums" data-events></div>
  <style>
    #bca-cell-review canvas {display:block;width:100%;touch-action:none;}
    #bca-cell-review [data-legend="wire"] {color:var(--muted-foreground);}
    #bca-cell-review [data-legend="token"] {color:var(--viz-series-1);}
    #bca-cell-review [data-legend="bin"] {color:var(--viz-series-2);}
    #bca-cell-review [data-legend="event"] {color:var(--viz-series-3);}
  </style>
  <script type="application/json" id="bca-cell-review-data">__BCA_CELL_DATA__</script>
</div>
<script>
(async function () {
  const root = document.getElementById('bca-cell-review');
  const data = JSON.parse(document.getElementById('bca-cell-review-data').textContent);
  const field = name => root.querySelector('[data-field="' + name + '"]');
  const status = root.querySelector('[data-status]');
  const canvas = root.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const [height, width] = data.shape;
  const [ox, oy] = data.offset;
  const stride = data.stride;
  async function unpack(text, rows = false) {
    const bytes = Uint8Array.from(atob(text), c => c.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const out = new Uint8Array(await new Response(stream).arrayBuffer());
    if (rows) for (let i = stride; i < out.length; ++i) out[i] ^= out[i-stride];
    return out;
  }
  try {
    const [geometry, initial, finals, ...replayBits] = await Promise.all([
      unpack(data.geometry), unpack(data.initial, true), unpack(data.finals, true),
      ...data.replays.map(r => unpack(r.bits, true))
    ]);
    if (geometry.length !== height * width || finals.length !== 514 * stride)
      throw new Error('セル数・試行数が保存情報と一致しません');
    const wire = [], bins = [], lookup = new Int32Array(geometry.length).fill(-1);
    for (let i = 0; i < geometry.length; ++i) {
      if (geometry[i] === 1) {lookup[i] = wire.length; wire.push(i);}
      if (geometry[i] === 255) bins.push(i);
    }
    let source = 'p1', trial = 1, region = 'A4', frame = 0, timer = null;
    let view, transform, drag = null, selectedBits, selectedOffset = 0;
    let colors, base = document.createElement('canvas');
    base.width = width; base.height = height;
    function color(variable) {
      const span = document.createElement('span');
      span.style.color = 'var(' + variable + ')'; root.appendChild(span);
      const result = getComputedStyle(span).color; span.remove(); return result;
    }
    function palette() {
      colors = {wire: color('--muted-foreground'), token: color('--viz-series-1'),
                bin: color('--viz-series-2'), event: color('--viz-series-3')};
      const b = base.getContext('2d'); b.clearRect(0, 0, width, height);
      b.fillStyle = colors.wire; b.globalAlpha = .48;
      for (const i of wire) b.fillRect(i % width, Math.floor(i / width), 1, 1);
      b.globalAlpha = 1; b.fillStyle = colors.bin;
      for (const i of bins) b.fillRect(i % width, Math.floor(i / width), 1, 1);
    }
    function stop() {clearInterval(timer); timer = null; root.querySelector('[data-action="play"]').textContent = '再生';}
    function isReplay() {return source.startsWith('replay');}
    function replayIndex() {return source === 'replay1' ? 0 : 1;}
    function selectBits() {
      let meta;
      if (source === 'initial') {
        selectedBits = initial; selectedOffset = 0;
        status.textContent = '初期状態 / 0 更新';
      } else if (isReplay()) {
        const r = data.replays[replayIndex()];
        frame = Math.max(0, Math.min(r.frames-1, frame));
        selectedBits = replayBits[replayIndex()]; selectedOffset = frame * stride;
        status.textContent = '診断再生 / p=' + r.p + ' / trial ' + r.trial + ' / ' + (r.step+frame).toLocaleString() + ' 更新';
      } else {
        const index = source === 'p1' ? trial : 512 + trial;
        meta = data.trials[index]; selectedBits = finals; selectedOffset = index * stride;
        status.textContent = 'p=' + meta.p + ' / trial ' + trial + ' / ' + meta.step.toLocaleString() + ' 更新 / 状態2：' + meta.tokens.toLocaleString() + ' セル';
      }
      root.querySelector('[data-replay]').hidden = !isReplay();
      field('trial').disabled = isReplay() || source === 'initial';
      field('trial').max = source === 'p05' ? 1 : 511;
      field('frame').value = frame;
      root.querySelector('[data-frame-label]').textContent = frame;
      if (isReplay()) field('frame').max = data.replays[replayIndex()].frames-1;
      root.querySelector('[data-events]').textContent = meta
        ? '保存履歴：TD→FSM ' + meta.events[0] + ' / FSM→Amp ' + meta.events[1] + ' / Amp ' + meta.events[2] + ' / Unit ' + meta.events[3] + ' / Comparator ' + meta.events[4] + ' / Reset ' + meta.events[5]
        : isReplay() ? '保存状態のコピーを同条件で追跡。本番の継続結果とは別の診断。' : '';
    }
    function occupied(k) {return (selectedBits[selectedOffset+(k>>3)] >> (k&7)) & 1;}
    function fit() {
      const [x0,x1,y0,y1] = data.regions[region];
      view = {x:(x0+x1)/2, y:(y0+y1)/2, w:x1-x0+3, h:y1-y0+3};
    }
    function draw() {
      const cssWidth = Math.max(260, root.clientWidth);
      const cssHeight = Math.min(600, Math.max(160, cssWidth * view.h/view.w));
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(cssWidth*dpr); canvas.height = Math.round(cssHeight*dpr);
      canvas.style.height = cssHeight + 'px'; ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.clearRect(0,0,cssWidth,cssHeight); ctx.imageSmoothingEnabled = false;
      const scale = Math.min((cssWidth-12)/view.w,(cssHeight-12)/view.h);
      const tx = cssWidth/2-view.x*scale, ty = cssHeight/2-view.y*scale;
      transform = {scale,tx,ty};
      ctx.save();ctx.beginPath();
      ctx.rect(tx+(view.x-view.w/2)*scale,ty+(view.y-view.h/2)*scale,view.w*scale,view.h*scale);
      ctx.clip();
      ctx.drawImage(base,tx+(ox-.5)*scale,ty+(oy-.5)*scale,width*scale,height*scale);
      ctx.fillStyle = colors.token;
      for (let k=0;k<wire.length;++k) if (occupied(k)) {
        const i=wire[k], x=tx+(i%width+ox)*scale, y=ty+(Math.floor(i/width)+oy)*scale;
        if (x<0||x>cssWidth||y<0||y>cssHeight) continue;
        ctx.beginPath();ctx.arc(x,y,Math.max(.95,scale*.40),0,Math.PI*2);ctx.fill();
      }
      ctx.strokeStyle = colors.event; ctx.lineWidth = 1.4;
      for (const e of data.events) {
        const x=tx+e[1]*scale, y=ty+e[2]*scale;
        if (x<0||x>cssWidth||y<0||y>cssHeight) continue;
        ctx.beginPath();ctx.arc(x,y,Math.max(3.5,scale*.75),0,Math.PI*2);ctx.stroke();
      }
      ctx.restore();
    }
    function save() {
      if (window.openai?.setWidgetState) window.openai.setWidgetState({
        modelContent:{source,trial,region,additional_steps:frame},privateContent:{view}
      }).catch(()=>{});
    }
    function apply(saved) {
      const m=saved?.modelContent, p=saved?.privateContent;
      if (m) {
        if (['p1','p05','initial','replay1','replay05'].includes(m.source)) source=m.source;
        if (data.regions[m.region]) region=m.region;
        if (Number.isInteger(m.trial)) trial=Math.min(source==='p05'?1:511,Math.max(0,m.trial));
        frame=Number.isInteger(m.additional_steps)?m.additional_steps:0;
      }
      fit();
      if (p?.view && ['x','y','w','h'].every(k=>Number.isFinite(p.view[k])) && p.view.w>0 && p.view.h>0) view=p.view;
      field('source').value=source;field('trial').value=trial;field('region').value=region;
      selectBits();draw();
    }
    field('source').addEventListener('change',()=>{stop();source=field('source').value;trial=Math.min(trial,source==='p05'?1:511);field('trial').value=trial;frame=0;selectBits();draw();save();});
    field('trial').addEventListener('change',()=>{trial=Math.max(0,Math.min(source==='p05'?1:511,Math.floor(Number(field('trial').value)||0)));field('trial').value=trial;selectBits();draw();save();});
    field('region').addEventListener('change',()=>{region=field('region').value;fit();draw();save();});
    field('frame').addEventListener('input',()=>{stop();frame=Number(field('frame').value);selectBits();draw();save();});
    function zoom(factor) {view.w=Math.max(8,Math.min(2000,view.w*factor));view.h=Math.max(8,Math.min(2000,view.h*factor));draw();save();}
    root.querySelector('[data-action="in"]').addEventListener('click',()=>zoom(.7));
    root.querySelector('[data-action="out"]').addEventListener('click',()=>zoom(1/.7));
    root.querySelector('[data-action="play"]').addEventListener('click',()=>{
      if(timer){stop();save();return;}
      if(frame===data.replays[replayIndex()].frames-1)frame=0;
      root.querySelector('[data-action="play"]').textContent='停止';
      timer=setInterval(()=>{frame++;selectBits();draw();if(frame===data.replays[replayIndex()].frames-1){stop();save();}},160);
    });
    canvas.addEventListener('pointerdown',e=>{drag={px:e.clientX,py:e.clientY,x:view.x,y:view.y};canvas.setPointerCapture(e.pointerId);});
    canvas.addEventListener('pointermove',e=>{
      if(drag){view.x=drag.x-(e.clientX-drag.px)/transform.scale;view.y=drag.y-(e.clientY-drag.py)/transform.scale;draw();}
      const box=canvas.getBoundingClientRect();
      const x=Math.round((e.clientX-box.left-transform.tx)/transform.scale),y=Math.round((e.clientY-box.top-transform.ty)/transform.scale);
      let label='範囲外';
      if(x>=ox&&x<ox+width&&y>=oy&&y<oy+height){const i=(y-oy)*width+x-ox;label=geometry[i]===255?'Token bin (-1)':lookup[i]>=0?(occupied(lookup[i])?'トークン (2)':'空の回路 (1)'):'背景 (0)';}
      const at=data.events.filter(e=>e[1]===x&&e[2]===y).map(e=>e[0]);
      root.querySelector('[data-coordinate]').textContent='('+x+', '+y+') / '+label+(at.length?' / '+at.join(', '):'');
    });
    function endDrag(){if(drag){drag=null;save();}}
    canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
    for (const [i,name] of ['replay1','replay05'].entries()) {
      field('source').querySelector('[value="'+name+'"]').textContent =
        'p='+data.replays[i].p+'・trial '+data.replays[i].trial+'の短時間再生';
    }
    palette();apply(window.openai?.widgetState);
    new ResizeObserver(()=>draw()).observe(root);
    new MutationObserver(()=>{palette();draw();}).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
    window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){stop();apply(e.detail.globals.widgetState);}});
    root.dataset.ready='true';
  } catch(error) {status.setAttribute('role','alert');status.textContent='表示できません：'+error.message;console.error(error);}
})();
</script>
